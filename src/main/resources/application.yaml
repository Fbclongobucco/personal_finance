spring:
  application:
    name: personal_finance_app
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

app:
  jwt:
    secret: ${APP_JWT_SECRET:this-is-a-dev-only-secret-key-change-it-before-going-to-production}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  admin:
    name: Administrator
    email: ${APP_ADMIN_EMAIL:admin123@personalfinance.local}
    phone: "00000000000"
    password: ${APP_ADMIN_PASSWORD:admin123}
